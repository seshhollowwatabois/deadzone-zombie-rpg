});

const close=()=>{hide();merchantShopOpen=false;keys.clear();mouse.down=false;last=0;if(dead){state='dead';gameOver()}else{state=fromShop;if(state==='play'&&!player){player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;initWorld();if(wave===0)startWave()}if(state==='play'){gunId=activeSlot==='primary'?(primaryGunId||secondaryGunId):(secondaryGunId||primaryGunId)||'pistol';player.ammo=ammoByGun[gunId]??getGun().mag;ammoByGun[gunId]=player.ammo;hud()}}};$('#back').onclick=close;$('#saveclose').onclick=close
}
function restartAfterDeath(){wave=0;breakT=0;waveClearPending=false;merchant=null;merchantShopOpen=false;pendingBoss=null;bossSpawnT=0;spawned=0;total=0;spawnT=0;fireT=0;reloadT=0;minigunSpin=0;zs=[];shots=[];rockets=[];blasts=[];laserBeams=[];gravityHoles=[];blizzards=[];particles=[];texts=[];drops=[];ammoBoxes=[];bossChests=[];gunId=activeSlot==='primary'?(primaryGunId||secondaryGunId||'pistol'):(secondaryGunId||primaryGunId||'pistol');player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;refillRunAmmo();initWorld();turret=turretEquipped?{x:player.x,y:player.y}:null;turretFireT=0;fireOrbStacks=0;fireOrbStackT=0;waterOrbHealT=0;killStreak=0;lastKillAt=0;state='play';keys.clear();mouse.down=false;last=0;startWave();save();hide();hud()}function handlePlayerDeath(){if(state==='dead')return;if(player)player.hp=0;state='dead';gameOver()}
function gameOver(){const reachedWave=wave;wave=0;merchant=null;merchantShopOpen=false;waveClearPending=false;smokerTether=null;supplyDrops=[];sporeZones=[];blizzards=[];activeWaveEvent=null;supplyDropPendingT=0;combatBoostT=0;hitMarkerT=0;save();modal(`<div class="eyebrow">SURVIVOR STATUS: KIA</div><h1>YOU DIDN'T<br>MAKE IT.</h1><p>You reached wave <b>${reachedWave}</b>, eliminated <b>${kills}</b> zombies and reached level <b>${level}</b>. Your cash and equipment are saved. Your next run starts at wave 1.</p><div class="actions"><button class="primary" id="retry">TRY AGAIN</button><button id="review">REVIEW ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#retry').onclick=restartAfterDeath;$('#review').onclick=()=>shopOpen(true);$('#home').onclick=()=>menu()}
$('#shop').onclick=()=>shopOpen();$('#pause').onclick=()=>pause();function pause(){if(state==='play'){state='pause';modal(`<div class="eyebrow">FIELD STATUS</div><h1>PAUSED</h1><p>Catch your breath. The infected can wait.</p><div class="actions"><button class="primary" id="resume">RESUME</button><button id="pShop">ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#resume').onclick=()=>{state='play';hide()};$('#pShop').onclick=()=>shopOpen();$('#home').onclick=()=>menu()}else if(state==='pause'){state='play';hide()}}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys.add(k);if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(!e.repeat&&state==='play'&&k==='1')switchWeapon('primary');if(!e.repeat&&state==='play'&&k==='2')switchWeapon('secondary');if(!e.repeat&&state==='play'&&k==='e'){if(!openNearbyMerchant()&&!openNearbyBossChest())openNearbySupplyDrop();}if(k==='r'&&state==='play'){if(!useAmmoBox())reload();}if(!e.repeat&&k==='g'&&state==='play'&&turretOwned&&turretEquipped){turret={x:player.x,y:player.y};turretFireT=0;toast('TURRET DEPLOYED');save()}if(k==='b'){if(state==='shop'){hide();state=fromShop}else shopOpen()}if(k==='escape')pause()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;crosshair.style.left=mouse.x+'px';crosshair.style.top=mouse.y+'px'});c.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});c.addEventListener('contextmenu',e=>e.preventDefault());function frame(t){requestAnimationFrame(frame);try{let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();crosshair.style.display=state==='play'?'block':'none'}catch(err){console.error('Deadzone frame recovered from an error:',err)}}if(load()){player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;initWorld()}menu();requestAnimationFrame(frame);
})();
</script></body></html>
