return '<div class="itemart '+(isGun?'weapon-art':'gear-art')+'"><svg viewBox="0 0 90 78" role="img" aria-label="'+type+' illustration"><defs><linearGradient id="metalg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#aeb5ad"/><stop offset=".2" stop-color="#68716a"/><stop offset=".58" stop-color="#353c38"/><stop offset="1" stop-color="#171d1a"/></linearGradient><linearGradient id="woodg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#a98255"/><stop offset=".35" stop-color="#6e4a2f"/><stop offset="1" stop-color="#30241a"/></linearGradient><linearGradient id="brassg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d0c49a"/><stop offset="1" stop-color="#66583b"/></linearGradient><radialGradient id="glowg"><stop stop-color="'+color+'" stop-opacity=".19"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></radialGradient></defs><ellipse cx="45" cy="38" rx="39" ry="29" fill="url(#glowg)"/><ellipse cx="45" cy="38" rx="34" ry="23" fill="none" stroke="'+color+'" stroke-opacity=".12" stroke-width="1"/><path d="M5 14h12m-12 0v7M85 14H73m12 0v7M5 63h12m-12 0v-7M85 63H73m12 0v-7" fill="none" stroke="'+color+'" stroke-opacity=".38" stroke-width=".7"/><g fill="url(#metalg)" stroke="#171b14" stroke-width="2.1" stroke-linejoin="round">'+shape+'</g><g fill="none" stroke="#d9d1b7" stroke-opacity=".55" stroke-width=".65">'+details+'</g>'+(isGun?'<g fill="url(#brassg)" stroke="#392d1c" stroke-width=".45"><circle cx="25" cy="35" r="1.1"/><circle cx="47" cy="35" r="1.1"/></g><g fill="none" stroke="#d6c9a8" stroke-opacity=".48" stroke-width=".6"><path d="M12 29l3-1m-1 13l3-1M39 28l2-1m14 12l3-1M62 30l3-1"/><path d="M15 49l3-1m8 9l2 1m21-3l2-1"/></g><path d="M8 68h74" stroke="#ad8c5a" stroke-width="1" opacity=".7"/><text x="9" y="11" fill="#c8b58b" font-size="4.5" letter-spacing="1">FIELD WORN</text>':'<path d="M8 68h74" stroke="'+color+'" stroke-width="1.5" opacity=".75"/>')+'<circle cx="72" cy="15" r="4.5" fill="'+color+'" opacity=".18"/><circle cx="72" cy="15" r="2.3" fill="'+color+'" opacity=".9"/></svg></div>'
}
function shopOpen(dead=false){fromShop=state==='menu'?'menu':'play';state='shop';tab='loadout';renderShop(dead)}
function renderShop(dead=false){
let tabs=[['loadout','LOADOUT'],['primary','PRIMARY'],['secondary','SECONDARY'],['armor','VESTS'],['gear','GEAR'],['relics','RELICS']],html='';
if(tab==='loadout'){
 const pg=primaryGunId?withWeaponRarity(guns.find(g=>g.id===primaryGunId)):null,sg=secondaryGunId?withWeaponRarity(guns.find(g=>g.id===secondaryGunId)):null,a=armor();
 const primaryCard=pg
  ? '<div class="item loadout-weapon-card"><div class="eyebrow">PRIMARY · KEY 1</div>'+itemArt(pg.id,pg.color)+'<h3>'+pg.name+'</h3><div class="eyebrow" style="color:'+weaponRarityTiers[getWeaponRarity(pg.id)].color+'">'+weaponRarityTiers[getWeaponRarity(pg.id)].name+'</div><div class="statsline">DMG '+Math.round(pg.d)+(isShotgun(pg)?'×'+pg.pellets:'')+' · MAG '+pg.mag+' · SPREAD '+weaponSpreadText(pg)+'</div><div class="price">'+(activeSlot==='primary'?'ACTIVE':'EQUIPPED')+'</div><button data-tab="primary">CHANGE PRIMARY</button></div>'
  : '<div class="item"><div class="eyebrow">PRIMARY · KEY 1</div><div class="itemart empty-slot"><span>EMPTY SLOT</span></div><h3>No primary equipped</h3><p>Buy a primary weapon to fill this slot.</p><button data-tab="primary">CHOOSE PRIMARY</button></div>';
 const secondaryCard=sg
  ? '<div class="item loadout-weapon-card"><div class="eyebrow">SECONDARY · KEY 2</div>'+itemArt(sg.id,sg.color)+'<h3>'+sg.name+'</h3><div class="eyebrow" style="color:'+weaponRarityTiers[getWeaponRarity(sg.id)].color+'">'+weaponRarityTiers[getWeaponRarity(sg.id)].name+'</div><div class="statsline">DMG '+Math.round(sg.d)+' · MAG '+sg.mag+' · SPREAD '+weaponSpreadText(sg)+'</div><div class="price">'+(activeSlot==='secondary'?'ACTIVE':'EQUIPPED')+'</div><button data-tab="secondary">CHANGE SECONDARY</button></div>'
  : '<div class="item"><div class="eyebrow">SECONDARY · KEY 2</div><div class="itemart empty-slot"><span>EMPTY SLOT</span></div><h3>No secondary equipped</h3><button data-tab="secondary">CHOOSE SECONDARY</button></div>';
 html='<div class="equippedbox"><div class="eyebrow">TWO-WEAPON LOADOUT · PRESS 1 OR 2 DURING COMBAT</div><div class="grid">'+primaryCard+secondaryCard+'</div><div class="eyebrow" style="margin-top:16px">EQUIPPED VEST</div><div class="itemtop" style="margin-top:8px">'+itemArt(a?a.id:'vest',a?'#a8e56b':'#64746a')+'<div><h3>'+(a?a.name:'No armor equipped')+'</h3><p>'+(a?a.desc:'Choose a vest in the VESTS tab.')+'</p></div></div></div>';
}
if(tab==='primary'){
 const primaryRank={scarh:1,m249:2,spas12:3,minigun:4,ak47:5,hk21:6,rifle:7,shotgun:8,dmr:9,smg:10};
 const list=guns.filter(g=>weaponSlot(g)==='primary').sort((a,b)=>primaryRank[b.id]-primaryRank[a.id]);
 html='<div class="eyebrow" style="grid-column:1/-1">PRIMARY WEAPONS · WORST TO BEST · PRESS 1 TO USE</div>'+list.map(g=>{let own=owned.has(g.id),eq=primaryGunId===g.id;return '<div class="item weapon-item">'+itemArt(g.id,g.color)+'<h3>'+g.name+(eq?' ✓':'')+'</h3>'+weaponStats(g)+'<div class="price">'+(own?'Owned':'$'+g.cost+' · Requires Lv '+g.lv)+'</div>'+(!own?'<button data-buy="'+g.id+'" '+(cash<g.cost||level<g.lv?'disabled':'')+'>BUY PRIMARY</button>':'<button data-equip="'+g.id+'" '+(eq?'disabled':'')+'>'+(eq?'EQUIPPED IN PRIMARY':'EQUIP PRIMARY')+'</button>')+'</div>'}).join('');
}
if(tab==='secondary'){
 const secondaryRank={rpg:1,mp5k:2,python:3,pistol:4};
 const list=guns.filter(g=>weaponSlot(g)==='secondary').sort((a,b)=>secondaryRank[b.id]-secondaryRank[a.id]);
 html='<div class="eyebrow" style="grid-column:1/-1">SECONDARY WEAPONS · WORST TO BEST · PRESS 2 TO USE YOUR EQUIPPED SECONDARY</div>'+list.map(g=>{let own=owned.has(g.id),eq=secondaryGunId===g.id;return '<div class="item weapon-item">'+itemArt(g.id,g.color)+'<h3>'+g.name+(eq?' ✓':'')+'</h3>'+weaponStats(g)+'<div class="price">'+(own?'Owned':'$'+g.cost)+'</div>'+(!own?'<button data-buy="'+g.id+'" '+(cash<g.cost||level<g.lv?'disabled':'')+'>BUY SECONDARY</button>':'<button data-equip="'+g.id+'" '+(eq?'disabled':'')+'>'+(eq?'EQUIPPED IN SECONDARY':'EQUIP SECONDARY')+'</button>')+'</div>'}).join('');
}

if(tab==='relics'){
 const relicCards=Object.keys(weaponRarityTiers).map(r=>{const ri=weaponRarityTiers[r];return '<div class="item" style="border:1px solid '+ri.color+';box-shadow:inset 0 0 0 1px '+ri.color+'22"><div class="eyebrow" style="color:'+ri.color+'">'+ri.name+' RELICS</div><div style="font-size:32px;font-weight:1000;color:'+ri.color+'">'+(relicCounts[r]||0)+'</div></div>'}).join('');
 const upgradeCards=guns.filter(g=>owned.has(g.id)).map(g=>{
  const rank=getWeaponRarity(g.id),ri=weaponRarityTiers[rank],recipe=weaponUpgradeRecipes[rank],next=recipe&&weaponRarityTiers[recipe.next],have=recipe?(relicCounts[recipe.relic]||0):0,ready=recipe&&have>=recipe.amount;
  return '<div class="item relic-weapon-card" style="border:1px solid '+ri.color+'">'+itemArt(g.id,g.color)+'<h3>'+g.name+'</h3>'+weaponStats(g)+(recipe?rarityUpgradePreview(g,recipe.next)+'<div class="statsline">UPGRADE TO <b style="color:'+next.color+'">'+next.name+'</b> · COST '+recipe.amount+' '+weaponRarityTiers[recipe.relic].name+' RELICS</div><div class="statsline">YOU HAVE '+have+' / '+recipe.amount+' '+weaponRarityTiers[recipe.relic].name+' RELICS</div><button data-upgrade-weapon="'+g.id+'" '+(ready?'':'disabled')+'>UPGRADE TO '+next.name+'</button>':'<div class="statsline" style="color:'+ri.color+'">MAXIMUM RARITY REACHED</div>')+'</div>'
 }).join('');
 html='<div style="grid-column:1/-1"><div class="eyebrow">BOSS RELICS · WEAPON RARITY</div><p>Bosses drop relics from chests.</p><div class="grid">'+relicCards+'</div><h2 style="margin-top:18px">UPGRADE OWNED WEAPONS</h2><div class="grid">'+(upgradeCards||'<div class="item"><p>Buy a weapon first to upgrade its rarity.</p></div>')+'</div></div>';
}

if(tab==='gear')html='<div class="item">'+itemArt('turret','#7dff70')+'<h3>Auto-Turret'+(turretEquipped?' ✓':'')+'</h3><p>Deploy a stationary automated turret with a 260-unit range. Fires at nearby infected for 20 damage per shot at 3 shots per second. Line of sight required.</p><div class="statsline">DAMAGE <b>20</b> · FIRE RATE <b>3.0/s</b> · RANGE <b>260</b></div><div class="price">'+(turretOwned?'Owned':'$600')+'</div>'+(turretOwned?'<button data-turret-equip>'+(turretEquipped?'EQUIPPED · G TO DEPLOY':'EQUIP TURRET')+'</button>':'<button data-turret-buy '+(cash<600?'disabled':'')+'>BUY & EQUIP · $600</button>')+'<p style="font-size:11px">Press G during combat to deploy/redeploy it at your position.</p></div>';
 if(tab==='armor')html=armors.map(a=>'<div class="item">'+itemArt(a.id,'#8aa5a0')+'<h3>'+a.name+(armorId===a.id?' ✓':'')+'</h3><p>'+a.desc+'</p><div class="price">'+(armorId===a.id?'Equipped':'$'+a.cost)+'</div><button data-armor="'+a.id+'" '+(armorId===a.id||cash<a.cost?'disabled':'')+'>'+(armorId===a.id?'EQUIPPED':'BUY & EQUIP')+'</button></div>').join('');

modal('<div class="eyebrow">FIELD QUARTERMASTER</div><h1>LOADOUT / ARMORY</h1><p>Equip one primary and one secondary at the same time. Switch with <b style="color:#a8e56b">1</b> and <b style="color:#a8e56b">2</b>. Purchases persist between runs. <b style="color:#ffd078">$'+cash+'</b> available · Level '+level+'</p><div class="tabs">'+tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'active':'')+'">'+t[1]+'</button>').join('')+'</div>'+(tab==='loadout'?html:'<div class="grid">'+html+'</div>')+'<div class="actions"><button class="primary" id="back">'+(dead?'BACK TO RESULTS':'RETURN TO FIELD')+'</button><button id="saveclose">SAVE & CLOSE</button></div>');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderShop(dead)});
document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let g=guns.find(x=>x.id===b.dataset.buy);if(g&&cash>=g.cost&&level>=g.lv&&!owned.has(g.id)){cash-=g.cost;owned.add(g.id);ammoByGun[g.id]=g.mag;reserveByGun[g.id]=gunReserve(g);equipWeapon(weaponSlot(g),g.id,true);save();renderShop(dead);toast(g.name+' acquired and equipped')}});
document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{const g=guns.find(x=>x.id===b.dataset.equip);if(g&&equipWeapon(weaponSlot(g),g.id,true)){save();renderShop(dead)}});

document.querySelectorAll('[data-upgrade-weapon]').forEach(b=>b.onclick=()=>{const id=b.dataset.upgradeWeapon;if(!owned.has(id))return;const rank=getWeaponRarity(id),recipe=weaponUpgradeRecipes[rank];if(!recipe)return;const have=relicCounts[recipe.relic]||0;if(have<recipe.amount){toast('NOT ENOUGH '+weaponRarityTiers[recipe.relic].name+' RELICS');return}relicCounts[recipe.relic]=have-recipe.amount;weaponRarityById[id]=recipe.next;const base=guns.find(g=>g.id===id),mod=withWeaponRarity(base);ammoByGun[id]=Math.min(Number.isFinite(ammoByGun[id])?ammoByGun[id]:mod.mag,mod.mag);reserveByGun[id]=Math.min(reserveByGun[id]||0,gunReserve(mod)+mod.mag);if(player&&gunId===id){player.ammo=Math.min(player.ammo,mod.mag);ammoByGun[id]=player.ammo}save();renderShop(dead);toast(base.name+' UPGRADED TO '+weaponRarityTiers[recipe.next].name)});

document.querySelectorAll('[data-armor]').forEach(b=>b.onclick=()=>{let a=armors.find(x=>x.id===b.dataset.armor);if(a&&cash>=a.cost){cash-=a.cost;armorId=a.id;if(player){player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+30)}save();renderShop(dead)}});document.querySelectorAll('[data-turret-buy]').forEach(b=>b.onclick=()=>{if(cash>=600&&!turretOwned){cash-=600;turretOwned=true;turretEquipped=true;if(player)turret={x:player.x,y:player.y};turretFireT=0;save();renderShop(dead);toast('AUTO-TURRET ACQUIRED')}});document.querySelectorAll('[data-turret-equip]').forEach(b=>b.onclick=()=>{turretEquipped=!turretEquipped;if(!turretEquipped)turret=null;else if(player)turret={x:player.x,y:player.y};turretFireT=0;save();renderShop(dead)});

const close=()=>{hide();keys.clear();mouse.down=false;last=0;if(dead){state='dead';gameOver()}else{state=fromShop;if(state==='play'&&!player){player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;initWorld();if(wave===0)startWave()}if(state==='play'){gunId=activeSlot==='primary'?(primaryGunId||secondaryGunId):(secondaryGunId||primaryGunId)||'pistol';player.ammo=ammoByGun[gunId]??getGun().mag;ammoByGun[gunId]=player.ammo;hud()}}};$('#back').onclick=close;$('#saveclose').onclick=close
}
function gameOver(){modal(`<div class="eyebrow">SURVIVOR STATUS: KIA</div><h1>YOU DIDN'T<br>MAKE IT.</h1><p>You reached wave <b>${wave}</b>, eliminated <b>${kills}</b> zombies and reached level <b>${level}</b>. Your cash and equipment are saved.</p><div class="actions"><button class="primary" id="retry">TRY AGAIN</button><button id="review">REVIEW ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#retry').onclick=()=>{player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;refillRunAmmo();zs=[];shots=[];particles=[];drops=[];state='play';startWave();save();hide()};$('#review').onclick=()=>shopOpen(true);$('#home').onclick=()=>menu()}
$('#shop').onclick=()=>shopOpen();$('#pause').onclick=()=>pause();function pause(){if(state==='play'){state='pause';modal(`<div class="eyebrow">FIELD STATUS</div><h1>PAUSED</h1><p>Catch your breath. The infected can wait.</p><div class="actions"><button class="primary" id="resume">RESUME</button><button id="pShop">ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#resume').onclick=()=>{state='play';hide()};$('#pShop').onclick=()=>shopOpen();$('#home').onclick=()=>menu()}else if(state==='pause'){state='play';hide()}}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys.add(k);if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(!e.repeat&&state==='play'&&k==='1')switchWeapon('primary');if(!e.repeat&&state==='play'&&k==='2')switchWeapon('secondary');if(!e.repeat&&state==='play'&&k==='e')openNearbyBossChest();if(k==='r'&&state==='play'){if(!useAmmoBox())reload();}if(!e.repeat&&k==='g'&&state==='play'&&turretOwned&&turretEquipped){turret={x:player.x,y:player.y};turretFireT=0;toast('TURRET DEPLOYED');save()}if(k==='b'){if(state==='shop'){hide();state=fromShop}else shopOpen()}if(k==='escape')pause()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});c.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});c.addEventListener('contextmenu',e=>e.preventDefault());function frame(t){requestAnimationFrame(frame);try{let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw()}catch(err){console.error('Deadzone frame recovered from an error:',err)}}if(load()){player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;initWorld()}menu();requestAnimationFrame(frame);
})();
</script></body></html>
