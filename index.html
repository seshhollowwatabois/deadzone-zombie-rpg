let player=null,zs=[],shots=[],particles=[],texts=[],obstacles=[],drops=[],keys=new Set(),mouse={x:W/2,y:H/2,down:false},cash=180,wave=0,level=1,xp=0,xpNext=100,kills=0,gunId='pistol',owned=new Set(['pistol']),upgrades={},armorId=null,ranks={},state='menu',tab='weapons',spawned=0,total=0,spawnT=0,breakT=0,fireT=0,reloadT=0,toastT=0,annT=0,shake=0,last=0,fromShop='play';

function spawnZombie(){let edge=Math.floor(rand(0,4)),x=edge===0?20:edge===1?world.w-20:rand(20,world.w-20),y=edge===2?20:edge===3?world.h-20:rand(20,world.h-20);let roll=Math.random(),type=wave>2&&roll<.18?'runner':wave>3&&roll<.29?'brute':wave>4&&roll<.4?'spitter':'walker',stats={walker:[44,58,10,'#687b5c',13],runner:[28,93,7,'#a2a75b',10],brute:[150,34,19,'#665148',22],spitter:[38,43,8,'#6e8b70',12]}[type];zs.push({x,y,r:stats[4],hp:stats[0]+wave*5,max:stats[0]+wave*5,speed:stats[1]+wave*1.3,dmg:stats[2]+wave*.4,color:stats[3],type,walk:rand(0,10),flash:0,attack:rand(.2,1),shoot:rand(1,2),dead:false})}

function update(dt){if(annT>0){annT-=dt;if(annT<=0)$('#announce').classList.remove('show')}if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').classList.remove('show')}if(!player)return;if(state==='play'){if(fireT>0)fireT-=dt;if(reloadT>0){reloadT-=dt;if(reloadT<=0){player.ammo=getGun().mag;toast('RELOADED')}}if(player.inv>0)player.inv-=dt;if(player.flash>0)player.flash-=dt;let dx=(keys.has('d')?1:0)-(keys.has('a')?1:0),dy=(keys.has('s')?1:0)-(keys.has('w')?1:0),len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;let nx=player.x+dx*speed()*dt,ny=player.y+dy*speed()*dt;if(!blocked(nx,player.y,player.r))player.x=nx;if(!blocked(player.x,ny,player.r))player.y=ny;if(dx||dy)player.walk+=dt*10;player.angle=Math.atan2(mouse.y-H/2,mouse.x-W/2);if(mouse.down)shoot();if(armor()?.regen)player.hp=Math.min(player.maxHp,player.hp+armor().regen*dt);

function hud(){if(!player)return;$('#wave').textContent=wave;$('#count').textContent=zs.length+Math.max(0,total-spawned);$('#cash').textContent='$'+Math.floor(cash);$('#level').textContent=level;$('#hptext').textContent=Math.ceil(player.hp)+' / '+player.maxHp;$('#hpbar').style.width=clamp(player.hp/player.maxHp*100,0,100)+'%';$('#xptext').textContent=Math.floor(xp)+' / '+xpNext+' XP';$('#xpbar').style.width=clamp(xp/xpNext*100,0,100)+'%';$('#weaponname').textContent=getGun().name;$('#ammo').textContent=player.ammo+' / ∞ · '+(reloadT>0?'RELOADING':'READY');$('#armorname').textContent=armor()?.name||'No armor equipped'}
function modal(html){$('#modal').innerHTML=html;$('#overlay').style.display='flex'}function hide(){$('#overlay').style.display='none'}
function menu(){state='menu';modal(`<div class="eyebrow">EMERGENCY BROADCAST // DAY 19</div><h1>THE CITY<br>IS LOST.</h1><p>One survivor. Endless infected. Scavenge cash, build your loadout and hold the line against the outbreak.</p><div class="grid"><div class="item"><h3>COMBAT</h3><p>WASD move · Mouse aim · Left-click fire · R reload.</p></div><div class="item"><h3>SURVIVAL RPG</h3><p>Clear waves for rewards. Buy weapons, armor and perks. Progress saves in this browser.</p></div></div><div class="actions"><button class="primary" id="deploy">DEPLOY</button><button id="menuShop">ARMORY</button><button id="reset">RESET PROGRESS</button></div><p style="font-size:11px">Prototype 0.1 · Single player · Browser save</p>`);$('#deploy').onclick=()=>{if(!player)startFresh();else{state='play';if(wave===0)startWave()}state='play';hide();announce('DEPLOYED','STAY ALIVE')};$('#menuShop').onclick=()=>shopOpen();$('#reset').onclick=()=>{if(confirm('Delete saved progress?')){localStorage.removeItem('deadzone-rpg');player=null;cash=180;wave=0;level=1;xp=0;xpNext=100;kills=0;gunId='pistol';owned=new Set(['pistol']);upgrades={};armorId=null;ranks={};menu()}}}
function shopOpen(dead=false){fromShop=state==='menu'?'menu':'play';state='shop';tab='weapons';renderShop(dead)}function renderShop(dead=false){let tabs=[['weapons','WEAPONS'],['armor','ARMOR'],['perks','PERKS']],html='';if(tab==='weapons')html=guns.map(g=>{let own=owned.has(g.id),eq=gunId===g.id,u=upgrades[g.id]||0,p=Math.round(140+u*150);return `<div class="item"><h3>${g.name} ${eq?'✓':''}</h3><p>${g.desc}<br><span style="color:#b8c9c2">DMG ${g.d} · ${(1/g.rate).toFixed(1)} shots/s · MAG ${g.mag} · UPGRADE ${u}/5</span></p><div class="price">${own?'Owned':'$'+g.cost+' · Requires Lv '+g.lv}</div>${!own?`<button data-buy="${g.id}" ${cash<g.cost||level<g.lv?'disabled':''}>BUY WEAPON</button>`:`<button data-equip="${g.id}" ${eq?'disabled':''}>${eq?'EQUIPPED':'EQUIP'}</button><button data-up="${g.id}" ${cash<p||u>=5?'disabled':''}>UPGRADE DAMAGE · $${p}</button>`}</div>`}).join('');if(tab==='armor')html=armors.map(a=>`<div class="item"><h3>${a.name} ${armorId===a.id?'✓':''}</h3><p>${a.desc}</p><div class="price">${armorId===a.id?'Equipped':'$'+a.cost}</div><button data-armor="${a.id}" ${armorId===a.id||cash<a.cost?'disabled':''}>${armorId===a.id?'EQUIPPED':'BUY & EQUIP'}</button></div>`).join('');if(tab==='perks')html=perks.map(p=>{let r=ranks[p.id]||0,price=Math.round(p.cost*(1+r*.8));return `<div class="item"><h3>${p.name} <span style="color:#a8e56b">RANK ${r}/${p.max}</span></h3><p>${p.desc}</p><div class="price">${r>=p.max?'MAX RANK':'$'+price}</div><button data-perk="${p.id}" ${r>=p.max||cash<price?'disabled':''}>${r>=p.max?'MAXED':'UPGRADE'}</button></div>`}).join('');modal(`<div class="eyebrow">FIELD QUARTERMASTER</div><h1>ARMORY</h1><p>Spend cash on gear. Purchases persist between runs. <b style="color:#ffd078">$${cash}</b> available · Level ${level}</p><div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'active':''}">${t[1]}</button>`).join('')}</div><div class="grid">${html}</div><div class="actions"><button class="primary" id="back">${dead?'BACK TO RESULTS':'RETURN TO FIELD'}</button><button id="saveclose">SAVE & CLOSE</button></div>`);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderShop(dead)});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let g=guns.find(x=>x.id===b.dataset.buy);if(g&&cash>=g.cost&&level>=g.lv){cash-=g.cost;owned.add(g.id);gunId=g.id;if(player)player.ammo=g.mag;save();renderShop(dead);toast(g.name+' acquired')}});document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{gunId=b.dataset.equip;if(player)player.ammo=getGun().mag;reloadT=0;save();renderShop(dead)});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let id=b.dataset.up,u=upgrades[id]||0,p=Math.round(140+u*150);if(cash>=p&&u<5){cash-=p;upgrades[id]=u+1;save();renderShop(dead)}});document.querySelectorAll('[data-armor]').forEach(b=>b.onclick=()=>{let a=armors.find(x=>x.id===b.dataset.armor);if(a&&cash>=a.cost){cash-=a.cost;armorId=a.id;if(player){player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+30)}save();renderShop(dead)}});document.querySelectorAll('[data-perk]').forEach(b=>b.onclick=()=>{let p=perks.find(x=>x.id===b.dataset.perk),r=ranks[p.id]||0,price=Math.round(p.cost*(1+r*.8));if(p&&cash>=price&&r<p.max){cash-=price;ranks[p.id]=r+1;if(player){player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+15)}save();renderShop(dead)}});const close=()=>{hide();if(dead){state='dead';gameOver()}else state=fromShop};$('#back').onclick=close;$('#saveclose').onclick=close}
function gameOver(){modal(`<div class="eyebrow">SURVIVOR STATUS: KIA</div><h1>YOU DIDN'T<br>MAKE IT.</h1><p>You reached wave <b>${wave}</b>, eliminated <b>${kills}</b> zombies and reached level <b>${level}</b>. Your cash and equipment are saved.</p><div class="actions"><button class="primary" id="retry">TRY AGAIN</button><button id="review">REVIEW ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#retry').onclick=()=>{player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;zs=[];shots=[];particles=[];drops=[];state='play';startWave();hide()};$('#review').onclick=()=>shopOpen(true);$('#home').onclick=()=>menu()}
$('#shop').onclick=()=>shopOpen();$('#pause').onclick=()=>pause();function pause(){if(state==='play'){state='pause';modal(`<div class="eyebrow">FIELD STATUS</div><h1>PAUSED</h1><p>Catch your breath. The infected can wait.</p><div class="actions"><button class="primary" id="resume">RESUME</button><button id="pShop">ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#resume').onclick=()=>{state='play';hide()};$('#pShop').onclick=()=>shopOpen();$('#home').onclick=()=>menu()}else if(state==='pause'){state='play';hide()}}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys.add(k);if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='r'&&state==='play')reload();if(k==='b'){if(state==='shop'){hide();state=fromShop}else shopOpen()}if(k==='escape')pause()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});c.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});c.addEventListener('contextmenu',e=>e.preventDefault());function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(frame)}if(load()){player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;initWorld()}menu();requestAnimationFrame(frame);
