</style></head><body><div class="game"><canvas id="c"></canvas><div class="hud"><div class="top"><div class="logo">DEADZONE<small>OUTBREAK SURVIVAL</small></div><div class="stats"><div class="pill">WAVE <b id="wave">1</b></div><div class="pill">INFECTED <b id="count">0</b></div><div class="pill">CASH <b id="cash">$180</b></div><div class="pill">LVL <b id="level">1</b></div><button id="shop">LOADOUT [B]</button><button id="pause">Ⅱ</button></div></div><div class="hint">WASD move · Mouse aim · Left click shoot · R reload · B armory · ESC pause</div><div class="announce" id="announce">WAVE 1<small>THEY'RE COMING</small></div><div class="vitals"><div class="label"><span>HEALTH</span><b id="hptext">100 / 100</b></div><div class="bar"><div class="fill" id="hpbar"></div></div><div class="label"><span>EXPERIENCE</span><b id="xptext">0 / 100 XP</b></div><div class="bar" style="margin-bottom:0"><div class="fill xp" id="xpbar" style="width:0"></div></div></div><div class="weapon"><strong id="weaponname">Service Pistol</strong><span id="ammo">12 / ∞ · READY</span><span id="armorname">No armor equipped</span></div><div class="toast" id="toast"></div><canvas id="map" class="minimap" width="200" height="150"></canvas></div><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#c'),ctx=c.getContext('2d'),map=$('#map'),mctx=map.getContext('2d');let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const world={w:2200,h:1650},guns=[{id:'pistol',name:'Service Pistol',desc:'Reliable, accurate sidearm.',d:22,rate:.28,mag:12,reload:1.05,speed:780,pellets:1,cost:0,lv:1,color:'#ffd48a'},{id:'smg',name:'Vector SMG',desc:'Fast automatic fire and large magazine.',d:13,rate:.095,mag:32,reload:1.35,speed:820,pellets:1,cost:260,lv:2,color:'#b8e8ff'},{id:'shotgun',name:'Pump Shotgun',desc:'Eight tighter-spread pellets with increased damage. Pierces 1 zombie; landing all 8 pellets on one target deals 1.5× total damage.',d:16,rate:.72,mag:6,reload:1.65,speed:620,pellets:8,spread:.22,pierce:1,cost:420,lv:3,color:'#ffbd83'},{id:'rifle',name:'Assault Rifle',desc:'Dependable automatic rifle. Pierces 1 zombie.',d:19,rate:.14,mag:28,reload:1.5,speed:900,pellets:1,pierce:1,cost:650,lv:4,color:'#c9f78a'},{id:'dmr',name:'DMR-7 Marksman',desc:'Heavy precision rounds.',d:56,rate:.65,mag:10,reload:1.8,speed:1150,pellets:1,cost:1000,lv:6,color:'#e5d4ff'}],armors=[{id:'vest',name:'Police Vest',desc:'+25 max HP, 12% damage reduction.',cost:300,hp:25,red:.12},{id:'kevlar',name:'Tactical Kevlar',desc:'+55 max HP, 24% damage reduction.',cost:850,hp:55,red:.24},{id:'medic',name:'Field Medic Rig',desc:'+25 max HP and slow regeneration.',cost:1100,hp:25,red:.08,regen:1.5}],perks=[{id:'vitality',name:'Hard to Kill',desc:'+20 maximum health per rank.',cost:180,max:5},{id:'trigger',name:'Steady Trigger',desc:'+10% weapon damage per rank.',cost:240,max:5},{id:'runner',name:'Combat Stimulants',desc:'+7% movement speed per rank.',cost:200,max:5},{id:'scavenger',name:'Scavenger',desc:'+12% cash earned per rank.',cost:260,max:5},{id:'medic',name:'Field Dressing',desc:'Restore 8 HP after each wave per rank.',cost:220,max:5}];
let player=null,zs=[],shots=[],laserBeams=[],particles=[],texts=[],obstacles=[],drops=[],keys=new Set(),mouse={x:W/2,y:H/2,down:false},cash=180,wave=0,level=1,xp=0,xpNext=100,kills=0,gunId='pistol',owned=new Set(['pistol']),upgrades={},armorId=null,ranks={},state='menu',tab='weapons',spawned=0,total=0,spawnT=0,breakT=0,fireT=0,reloadT=0,toastT=0,annT=0,shake=0,last=0,fromShop='play';
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),getGun=()=>guns.find(g=>g.id===gunId)||guns[0],armor=()=>armors.find(a=>a.id===armorId),maxHp=()=>100+(armor()?.hp||0)+(ranks.vitality||0)*20,red=()=>armor()?.red||0,damage=()=>getGun().d*(1+(ranks.trigger||0)*.1)*(1+(upgrades[gunId]||0)*.12),speed=()=>player.speed*(1+(ranks.runner||0)*.07),bonus=()=>1+(ranks.scavenger||0)*.12;
function save(){try{localStorage.setItem('deadzone-rpg',JSON.stringify({cash,wave,level,xp,xpNext,kills,gunId,owned:[...owned],upgrades,armorId,ranks}))}catch(e){}}function load(){try{let s=JSON.parse(localStorage.getItem('deadzone-rpg')||'null');if(!s)return false;cash=s.cash??180;wave=s.wave||0;level=s.level||1;xp=s.xp||0;xpNext=s.xpNext||100;kills=s.kills||0;gunId=s.gunId||'pistol';owned=new Set(s.owned||['pistol']);upgrades=s.upgrades||{};armorId=s.armorId||null;ranks=s.ranks||{};return true}catch(e){return false}}
function newPlayer(){return{x:world.w/2,y:world.h/2,r:16,hp:100,maxHp:100,speed:220,angle:0,walk:0,flash:0,inv:0,ammo:getGun().mag}}function initWorld(){obstacles=[];for(let i=0;i<45;i++){let x=rand(80,world.w-80),y=rand(80,world.h-80);if(Math.hypot(x-world.w/2,y-world.h/2)<180)continue;let t=Math.random();obstacles.push({x,y,w:t<.25?rand(80,140):rand(40,75),h:t<.25?rand(32,50):rand(42,85),type:t<.25?'car':t<.6?'rubble':'barrier',rot:rand(-.12,.12)})}}
function startFresh(){cash=180;wave=0;level=1;xp=0;xpNext=100;kills=0;gunId='pistol';owned=new Set(['pistol']);upgrades={};armorId=null;ranks={};player=newPlayer();player.maxHp=maxHp();zs=[];shots=[];particles=[];texts=[];drops=[];initWorld();startWave();save()}
function startWave(){wave++;spawned=0;total=5+wave*3;spawnT=.5;breakT=0;zs=[];announce('WAVE '+wave,'THEY’RE COMING');$('#wave').textContent=wave;save()}
function announce(a,b){let n=$('#announce');n.innerHTML=a+'<small>'+b+'</small>';n.classList.add('show');annT=2.1}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');toastT=2}
function xpGain(n){xp+=n;while(xp>=xpNext){xp-=xpNext;level++;xpNext=Math.round(xpNext*1.22);player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+20);cash+=75;announce('LEVEL UP','LEVEL '+level+' · +$75')}save()}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),s=rand(30,230),life=rand(.15,.65);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,size:rand(1,4),color})}}
function spawnZombie(){let edge=Math.floor(rand(0,4)),x=edge===0?20:edge===1?world.w-20:rand(20,world.w-20),y=edge===2?20:edge===3?world.h-20:rand(20,world.h-20);let roll=Math.random(),type=wave>2&&roll<.18?'runner':wave>3&&roll<.29?'brute':wave>4&&roll<.4?'spitter':'walker',stats={walker:[44,58,10,'#687b5c',13],runner:[28,93,7,'#a2a75b',10],brute:[150,34,19,'#665148',22],spitter:[38,43,8,'#6e8b70',12]}[type];zs.push({x,y,r:stats[4],hp:stats[0]+wave*5,max:stats[0]+wave*5,speed:stats[1]+wave*1.3,dmg:stats[2]+wave*.4,color:stats[3],type,walk:rand(0,10),flash:0,attack:rand(.2,1),shoot:rand(1,2),dead:false})}
function zombieHead(z){const a=Math.atan2(player.y-z.y,player.x-z.x)-Math.PI/2;return{x:z.x+Math.sin(a)*z.r*.72,y:z.y-Math.cos(a)*z.r*.72}}function hitZombie(z,d,headshot=false){const dealt=headshot?d*2:d;z.hp-=dealt;z.flash=.12;texts.push({x:z.x,y:z.y-18,t:headshot?'HEADSHOT '+Math.round(dealt):Math.round(dealt),life:headshot?.9:.65,max:headshot?.9:.65,color:headshot?'#ffd078':'#ffe8a3'});burst(z.x,z.y,headshot?'#ffd078':'#a83c35',headshot?8:3);if(headshot)shake=Math.max(shake,2.5);if(z.hp<=0&&!z.dead){z.dead=true;kills++;let reward=Math.round(rand(9,18)*bonus());cash+=reward;xpGain(z.type==='brute'?30:15);if(Math.random()<.12)drops.push({x:z.x,y:z.y,life:14});burst(z.x,z.y,'#6e302b',15);if(z.type==='spitter')burst(z.x,z.y,'#79c56c',9);save()}}
function reload(){if(!player||reloadT>0||player.ammo===getGun().mag)return;reloadT=getGun().reload;toast('RELOADING…')}
function aimAngle(){if(!player)return 0;const q=cam(),targetX=mouse.x+q.x-W/2,targetY=mouse.y+q.y-H/2;return Math.atan2(targetY-player.y,targetX-player.x)}function laserRay(angle,g,shotHits=null){
 const ox=player.x+Math.cos(angle)*21,oy=player.y+Math.sin(angle)*21,range=g.id==='dmr'?1500:g.id==='rifle'?1250:g.id==='smg'?900:g.id==='shotgun'?560:820,dx=Math.cos(angle),dy=Math.sin(angle);
 let end=range;
 for(let d=4;d<range;d+=4){const x=ox+dx*d,y=oy+dy*d;if(x<0||y<0||x>world.w||y>world.h||obstacles.some(o=>x>o.x-o.w/2&&x<o.x+o.w/2&&y>o.y-o.h/2&&y<o.y+o.h/2)){end=d;break}}
 const targets=[];
 for(const z of zs){if(z.dead)continue;const zx=z.x-ox,zy=z.y-oy,proj=zx*dx+zy*dy;if(proj<0||proj>end)continue;const perp=Math.abs(zx*dy-zy*dx);if(perp<=z.r+2){const h=zombieHead(z),headProj=(h.x-ox)*dx+(h.y-oy)*dy,headPerp=Math.abs((h.x-ox)*dy-(h.y-oy)*dx);targets.push({z,proj,headshot:headProj>=0&&headProj<=end&&headPerp<=z.r*.39})}}

 const styles={pistol:{width:2.2,glow:5},smg:{width:1.4,glow:3.5},shotgun:{width:3.2,glow:7},rifle:{width:2.5,glow:5.5},dmr:{width:4.5,glow:11}};
 const st=styles[g.id]||styles.pistol;

}function shoot(){let g=getGun();if(reloadT>0||fireT>0)return;if(player.ammo<=0){reload();return}fireT=g.rate;player.ammo--;let a=aimAngle();player.angle=a;const shotHits=g.id==='shotgun'?[]:null;for(let i=0;i<g.pellets;i++){let ang=a+rand(-(g.spread||.018),g.spread||.018);laserRay(ang,g,shotHits)}if(shotHits){const grouped=new Map();for(const h of shotHits){let v=grouped.get(h.z);if(!v){v={body:0,head:0};grouped.set(h.z,v)}if(h.headshot)v.head++;else v.body++}for(const [z,h] of grouped){const allPellets=h.body+h.head===g.pellets,mult=allPellets?1.5:1,d=damage()*mult;if(h.body)hitZombie(z,d*h.body/(h.body+h.head),false);if(h.head)hitZombie(z,d*h.head/(h.body+h.head)/2,true)}}player.flash=.06;burst(player.x+Math.cos(a)*24,player.y+Math.sin(a)*24,g.color,4)}
function blocked(x,y,r){return x<r||y<r||x>world.w-r||y>world.h-r||obstacles.some(o=>x>o.x-o.w/2-r&&x<o.x+o.w/2+r&&y>o.y-o.h/2-r&&y<o.y+o.h/2+r)}

function shopOpen(dead=false){fromShop=state==='menu'?'menu':'play';state='shop';tab='loadout';renderShop(dead)}function renderShop(dead=false){let tabs=[['loadout','LOADOUT'],['weapons','WEAPONS'],['armor','GEAR'],['perks','PERKS']],html='';if(tab==='loadout'){let g=getGun(),a=armor();html='<div class="equippedbox"><div class="eyebrow">CURRENT PRIMARY</div><div class="itemtop">'+itemArt(g.id,g.color)+'<div><h3>'+g.name+'</h3><p>'+g.desc+'</p><div class="statsline">DMG '+Math.round(damage())+' · MAG '+g.mag+' · '+(1/g.rate).toFixed(1)+' shots/s</div></div></div><div class="eyebrow" style="margin-top:14px">EQUIPPED GEAR</div><div class="itemtop" style="margin-top:8px">'+itemArt(a?a.id:'vest',a?'#a8e56b':'#64746a')+'<div><h3>'+(a?a.name:'No armor equipped')+'</h3><p>'+(a?a.desc:'Choose protective gear in the GEAR tab.')+'</p></div></div></div><h2 style="font-size:17px;margin:18px 0 0">OWNED WEAPONS</h2><div class="grid">'+guns.filter(x=>owned.has(x.id)).map(x=>'<div class="item">'+itemArt(x.id,x.color)+'<h3>'+x.name+'</h3><div class="statsline">DMG '+Math.round(x.d*(1+(ranks.trigger||0)*.1)*(1+(upgrades[x.id]||0)*.12))+' · MAG '+x.mag+'</div><div class="price">'+(gunId===x.id?'EQUIPPED':'OWNED')+'</div><button data-equip="'+x.id+'" '+(gunId===x.id?'disabled':'')+'>'+(gunId===x.id?'EQUIPPED':'EQUIP WEAPON')+'</button></div>').join('')+'</div>'}if(tab==='weapons')html=guns.map(g=>{let own=owned.has(g.id),eq=gunId===g.id,u=upgrades[g.id]||0,p=Math.round(140+u*150);return `<div class="item">${itemArt(g.id,g.color)}<h3>${g.name} ${eq?'✓':''}</h3><p>${g.desc}<br><span style="color:#b8c9c2">DMG ${g.d} · ${(1/g.rate).toFixed(1)} shots/s · MAG ${g.mag} · UPGRADE ${u}/5</span></p><div class="price">${own?'Owned':'$'+g.cost+' · Requires Lv '+g.lv}</div>${!own?`<button data-buy="${g.id}" ${cash<g.cost||level<g.lv?'disabled':''}>BUY WEAPON</button>`:`<button data-equip="${g.id}" ${eq?'disabled':''}>${eq?'EQUIPPED':'EQUIP'}</button><button data-up="${g.id}" ${cash<p||u>=5?'disabled':''}>UPGRADE DAMAGE · $${p}</button>`}</div>`}).join('');if(tab==='armor')html=armors.map(a=>`<div class="item">${itemArt(a.id,a.id==='medic'?'#a8e56b':'#8aa5a0')}<h3>${a.name} ${armorId===a.id?'✓':''}</h3><p>${a.desc}</p><div class="price">${armorId===a.id?'Equipped':'$'+a.cost}</div><button data-armor="${a.id}" ${armorId===a.id||cash<a.cost?'disabled':''}>${armorId===a.id?'EQUIPPED':'BUY & EQUIP'}</button></div>`).join('');if(tab==='perks')html=perks.map(p=>{let r=ranks[p.id]||0,price=Math.round(p.cost*(1+r*.8));return `<div class="item">${itemArt(p.id==='medic'?'medicperk':p.id,'#a8e56b')}<h3>${p.name} <span style="color:#a8e56b">RANK ${r}/${p.max}</span></h3><p>${p.desc}</p><div class="price">${r>=p.max?'MAX RANK':'$'+price}</div><button data-perk="${p.id}" ${r>=p.max||cash<price?'disabled':''}>${r>=p.max?'MAXED':'UPGRADE'}</button></div>`}).join('');modal(`<div class="eyebrow">FIELD QUARTERMASTER</div><h1>LOADOUT / ARMORY</h1><p>Buy and equip your kit for endless survival. Purchases persist between runs. <b style="color:#ffd078">$${cash}</b> available · Level ${level}</p><div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'active':''}">${t[1]}</button>`).join('')}</div><div class="grid">${html}</div><div class="actions"><button class="primary" id="back">${dead?'BACK TO RESULTS':'RETURN TO FIELD'}</button><button id="saveclose">SAVE & CLOSE</button></div>`);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderShop(dead)});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let g=guns.find(x=>x.id===b.dataset.buy);if(g&&cash>=g.cost&&level>=g.lv){cash-=g.cost;owned.add(g.id);gunId=g.id;if(player)player.ammo=g.mag;save();renderShop(dead);toast(g.name+' acquired')}});document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{gunId=b.dataset.equip;if(player)player.ammo=getGun().mag;reloadT=0;save();renderShop(dead)});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let id=b.dataset.up,u=upgrades[id]||0,p=Math.round(140+u*150);if(cash>=p&&u<5){cash-=p;upgrades[id]=u+1;save();renderShop(dead)}});document.querySelectorAll('[data-armor]').forEach(b=>b.onclick=()=>{let a=armors.find(x=>x.id===b.dataset.armor);if(a&&cash>=a.cost){cash-=a.cost;armorId=a.id;if(player){player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+30)}save();renderShop(dead)}});document.querySelectorAll('[data-perk]').forEach(b=>b.onclick=()=>{let p=perks.find(x=>x.id===b.dataset.perk),r=ranks[p.id]||0,price=Math.round(p.cost*(1+r*.8));if(p&&cash>=price&&r<p.max){cash-=price;ranks[p.id]=r+1;if(player){player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+15)}save();renderShop(dead)}});const close=()=>{hide();if(dead){state='dead';gameOver()}else state=fromShop};$('#back').onclick=close;$('#saveclose').onclick=close}
function gameOver(){modal(`<div class="eyebrow">SURVIVOR STATUS: KIA</div><h1>YOU DIDN'T<br>MAKE IT.</h1><p>You reached wave <b>${wave}</b>, eliminated <b>${kills}</b> zombies and reached level <b>${level}</b>. Your cash and equipment are saved.</p><div class="actions"><button class="primary" id="retry">TRY AGAIN</button><button id="review">REVIEW ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#retry').onclick=()=>{player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;zs=[];shots=[];particles=[];drops=[];state='play';startWave();hide()};$('#review').onclick=()=>shopOpen(true);$('#home').onclick=()=>menu()}
$('#shop').onclick=()=>shopOpen();$('#pause').onclick=()=>pause();function pause(){if(state==='play'){state='pause';modal(`<div class="eyebrow">FIELD STATUS</div><h1>PAUSED</h1><p>Catch your breath. The infected can wait.</p><div class="actions"><button class="primary" id="resume">RESUME</button><button id="pShop">ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#resume').onclick=()=>{state='play';hide()};$('#pShop').onclick=()=>shopOpen();$('#home').onclick=()=>menu()}else if(state==='pause'){state='play';hide()}}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys.add(k);if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='r'&&state==='play')reload();if(k==='b'){if(state==='shop'){hide();state=fromShop}else shopOpen()}if(k==='escape')pause()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});c.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});c.addEventListener('contextmenu',e=>e.preventDefault());function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(frame)}if(load()){player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;initWorld()}menu();requestAnimationFrame(frame);
})();
</script></body></html>
