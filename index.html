(()=>{'use strict';const $=s=>document.querySelector(s),c=$('#c'),ctx=c.getContext('2d'),map=$('#map'),mctx=map.getContext('2d');let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const world={w:2200,h:1650},guns=[{id:'pistol',name:'M9',desc:'Reliable, accurate sidearm.',d:22,rate:.28,mag:16,reload:1.05,speed:780,pellets:1,cost:0,lv:1,color:'#ffd48a'},{id:'python',name:'Python',desc:'Heavy revolver. 80 base damage, 2× headshots, and pierces 2 zombies.',d:80,rate:.62,mag:6,reload:1.6,speed:1050,pellets:1,pierce:2,cost:520,lv:3,color:'#e6b875'},{id:'smg',name:'Vector SMG',desc:'Fast automatic fire and large magazine.',d:17,rate:.095,mag:32,reload:1.35,speed:820,pellets:1,cost:260,lv:2,color:'#b8e8ff'},{id:'shotgun',name:'Pump Shotgun',desc:'Eight tighter-spread pellets. Every hit pellet deals full damage; headshot pellets deal 2×. Pierces 1 zombie.',d:40,rate:.72,mag:6,reload:1.65,speed:620,pellets:8,spread:.22,pierce:1,cost:420,lv:3,color:'#ffbd83'},{id:'rifle',name:'Assault Rifle',desc:'Dependable automatic rifle. Pierces 1 zombie.',d:25,rate:.14,mag:28,reload:1.5,speed:900,pellets:1,pierce:1,cost:650,lv:4,color:'#c9f78a'},{id:'hk21',name:'HK21',desc:'Heavy machine gun with slower fire, harder-hitting rounds, a 20-round magazine, and 2 pierce.',d:35,rate:.24,mag:20,reload:1.9,speed:960,pellets:1,pierce:2,cost:900,lv:5,color:'#e6c779'},{id:'m249',name:'M249',desc:'Light machine gun. 100-round magazine, 70 damage, 3 pierce, and 5.5 rounds per second. Reduces movement speed by 30% while active.',d:70,rate:1/5.5,mag:100,reload:3.6,speed:1050,pellets:1,pierce:3,cost:1600,lv:7,color:'#b7d28a'},{id:'dmr',name:'DMR-7 Marksman',desc:'Heavy precision rounds.',d:56,rate:.65,mag:10,reload:1.8,speed:1150,pellets:1,cost:1000,lv:6,color:'#e5d4ff'}],armors=[{id:'vest',name:'Police Vest',desc:'+25 max HP, 12% damage reduction.',cost:300,hp:25,red:.12},{id:'kevlar',name:'Tactical Kevlar',desc:'+55 max HP, 24% damage reduction.',cost:850,hp:55,red:.24},{id:'medic',name:'Field Medic Rig',desc:'+25 max HP and slow regeneration.',cost:1100,hp:25,red:.08,regen:1.5}],perks=[{id:'vitality',name:'Hard to Kill',desc:'+20 maximum health per rank.',cost:180,max:5},{id:'t const isGun=['pistol','python','smg','shotgun','rifle','hk21','m249','dmr'].includes(type);

if(isGun){
const crops={
pistol:[49,117,84,63],
python:[49,117,84,63],
smg:[353,116,125,72],
shotgun:[16,300,142,56],
rifle:[352,297,143,71],
 hk21:[352,297,143,71],
m249:[352,297,143,71],
dmr:[15,482,290,78]
};
const [x,y,w,h]=crops[type];
return '<div class="itemart weapon-art reference-sprite"><svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+type+' weapon artwork"><svg x="0" y="0" width="'+w+'" height="'+h+'" viewBox="'+x+' '+y+' '+w+' '+h+'" preserveAspectRatio="none" overflow="hidden"><image href="./Screenshot%202026-10-13%204.49.24%20PM.png" x="0" y="0" width="668" height="620" preserveAspectRatio="none"/></svg></svg></div>';
}
// Render non-gun equipment with the built-in SVG art below.
if(type==='pistol'){

shape='<path d="M17 31h34l4 3v7H18z" fill="#505752"/><path d="M19 27h29l4 4H19z" fill="#8c938b"/><path d="M22 28h23v1.5H22z" fill="#c0c5ba"/><path d="M49 31h6v7h-6z" fill="#252b28"/><path d="M53 33h6v3h-6z" fill="#111614"/><path d="M24 40h17l-2 5-6 17-9-2-3-5 6-13z" fill="#292e2b"/><path d="M25 45l10 1-5 13-5-1-2-4z" fill="#4e493e"/><path d="M31 42q7 1 7 6q0 4-5 5" fill="none" stroke="#111512" stroke-width="2"/><path d="M20 26l-1-4h4l2 4M44 27v-4h4v4" fill="#4e554f"/><rect x="30" y="31" width="10" height="3" rx="1" fill="#252b28"/><circle cx="22" cy="35" r="1" fill="#c1b080"/>';

}else if(type==='smg'){
// Compact Vector-style SMG: short receiver, large distinctive curved magazine and compact barrel assembly.
shape='<path d="M5 30l10-3 7 4v8l-10 3-7-5z" fill="#3f4641"/><path d="M18 28h27v13H18z" fill="#343b37"/><path d="M20 25h23v4H20z" fill="#656d65"/><path d="M44 30h14v7H44z" fill="#454c46"/><path d="M57 31h14v4H57z" fill="#242a27"/><path d="M70 32h11v3h-11z" fill="#151a18"/><path d="M81 29v-5h3v5" fill="#555d55"/><path d="M29 40h10l-1 8q-1 8-8 12l-5-3 4-10z" fill="#242a27"/><path d="M28 44h8m-9 4h8m-9 4h7m-6 4h5" stroke="#858b80" stroke-width="1"/><path d="M6 30l-1-5h5l6 4" fill="#596158"/><path d="M21 30h20m-20 3h20m-20 3h20" stroke="#92998e" stroke-width=".8"/><path d="M47 30v7m4-7v7m4-7v7" stroke="#171c19" stroke-width="1.6"/><rect x="34" y="41" width="7" height="4" rx="1" fill="#1c221f"/>';
details='<path d="M61 32h8m-8 2h8M9 32l5 2" stroke="#c3c9bc" stroke-width=".7"/>';
}else if(type==='shotgun'){
// Full-length pump shotgun. The ribbed fore-end is a separate, clearly visible piece below the barrel.
shape='<path d="M4 31l13-3 8 3v10l-9 3-12-5z" fill="#795538"/><path d="M18 29h15v12H18z" fill="#353b37"/><path d="M31 29h27v4H31z" fill="#777e77"/><path d="M56 30h23v3H56z" fill="#454c47"/><path d="M78 29h7v5h-7z" fill="#171d1a"/><path d="M23 39h8v5q0 5-6 5h-2v-3h2q3 0 3-3v-2h-5z" fill="#171c19"/><path d="M32 35h25v8H32z" fill="#303733"/><path d="M34 36h21v5H34z" fill="#6a7169"/><path d="M34 35v9m4-9v9m4-9v9m4-9v9m4-9v9m4-9v9" stroke="#1a201c" stroke-width="1.4"/><path d="M7 32l10 1m-9 2l9 1" stroke="#b28a5b" stroke-width="1"/><path d="M33 29h22m-22 2h22M60 31h15" stroke="#c0c5bb" stroke-width=".8"/><path d="M19 28l2-4h3v4M73 29v-4h3v4" fill="#454c47"/>';
details='<path d="M35 37h18m-18 2h18M61 31h12" stroke="#d0d4c9" stroke-width=".7"/><path d="M34 45h20" stroke="#111713" stroke-width="1.4"/>';
}else if(type==='rifle'){
// Conventional assault rifle: long handguard, separate buttstock, pistol grip and unmistakable curved magazine.
shape='<path d="M3 30l13-3 8 3v10l-9 4-12-5z" fill="#795637"/><path d="M19 28h14v13H19z" fill="#4d554d"/><path d="M32 29h21v12H32z" fill="#343b36"/><path d="M52 30h23v5H52z" fill="#505850"/><path d="M74 30h10v5H74z" fill="#222824"/><path d="M83 28v-5h3v5" fill="#4d554d"/><path d="M35 40h8l3 8-4 3-8-5z" fill="#202621"/><path d="M43 40h7q5 3 4 9l-4 8-6-1 2-7-5-4z" fill="#292f2a"/><path d="M22 30h9v2h-9zM35 31h14v2H35zM55 31h16v1.5H55z" fill="#b0b8ac"/><path d="M22 27v-4h4v4M45 28v-5h4v5" fill="#535b52"/><path d="M23 35h7m-7 3h7m8-5h11" stroke="#899287" stroke-width=".8"/><rect x="36" y="33" width="8" height="3" rx="1" fill="#242a25"/>';
details='<path d="M57 32h13m-11 2h11M6 32l8 2" stroke="#c6ccc0" stroke-width=".7"/>';
}else if(type==='dmr'){
// Long designated marksman rifle: extended precision barrel and prominent telescopic optic over a slim receiver.
shape='<path d="M3 31l16-3 7 3v9l-10 4-12-5z" fill="#795638"/><path d="M22 29h13v12H22z" fill="#4b534c"/><path d="M34 29h20v12H34z" fill="#303833"/><path d="M53 30h27v3H53z" fill="#555e56"/><path d="M79 29h6v5h-6z" fill="#171d1a"/><path d="M35 40h8l3 8-4 4-7-5z" fill="#242a26"/><path d="M40 40h8q5 4 3 10l-4 7-6-2 2-6-5-4z" fill="#202621"/><rect x="27" y="19" width="31" height="9" rx="3" fill="#252c27" stroke="#8e978a" stroke-width="1.2"/><rect x="31" y="21" width="23" height="5" rx="2" fill="#4b6265"/><rect x="35" y="22" width="15" height="2.5" rx="1.2" fill="#c0d0ca"/><path d="M31 18v11m23-11v11" stroke="#b4b7a1" stroke-width="1.8"/><path d="M22 29h10v2H22zM56 31h19v1H56z" fill="#c0c6ba"/><path d="M8 32h9m-9 3h9m13-7v-4h3v4" stroke="#9ba395" stroke-width="1"/>';
details='<path d="M60 31h13m-11 2h10M29 43l5 1m-4 3l5 1" stroke="#c7cdbf" stroke-width=".8"/>';
}else if(type==='vest'){
shape='<path d="M29 17l-12 8-5 22 14 7 7-12 7 12 14-7-5-22-12-8-4 8z"/><path d="M29 28h12v20H29z M17 34h10v7H17z M43 34h10v7H43z" fill="#64766a"/>';
}else if(type==='kevlar'){
shape='<path d="M29 14l-15 10-3 25 15 7 8-13 8 13 15-7-3-25-15-10-5 8z"/><path d="M25 27h22v23H25z M29 31h14v3H29z M29 38h14v3H29z" fill="#8a9c89"/>';
}else if(type==='medic'||type==='medicperk'){
shape='<rect x="15" y="21" width="52" height="38" rx="7"/><path d="M36 27h10v9h9v9h-9v9H36v-9h-9v-9h9z" fill="#f4f5e9"/>';
}else if(type==='vitality'){
shape='<path d="M42 62S13 44 13 29c0-16 20-19 29-5 9-14 29-11 29 5 0 15-29 33-29 33z"/>';
}else if(type==='trigger'){
shape='<path d="M18 20h42v8H18z M24 28h30v13H24z M29 41h9v18h-9z"/><circle cx="60" cy="47" r="9"/>';
}else if(type==='runner'){
shape='<circle cx="42" cy="22" r="7"/><path d="M37 31l-12 14 12 7 8-10 9 17 7-4-11-24z M28 45L14 56l5 5 17-9z"/>';
}else if(type==='scavenger'){
shape='<path d="M18 23h48v36H18z M27 15h30v8H27z"/><path d="M34 30h16v5H34z M39 25h6v17h-6z" fill="#f6d47d"/>';
}else{
shape='<path d="M42 14l7 19 20 2-15 13 5 20-17-11-17 11 5-20-15-13 20-2z"/>';
}
return '<div class="itemart '+(isGun?'weapon-art':'gear-art')+'"><svg viewBox="0 0 90 78" role="img" aria-label="'+type+' illustration"><defs><linearGradient id="metalg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#aeb5ad"/><stop offset=".2" stop-color="#68716a"/><stop offset=".58" stop-color="#353c38"/><stop offset="1" stop-color="#171d1a"/></linearGradient><linearGradient id="woodg" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#a98255"/><stop offset=".35" stop-color="#6e4a2f"/><stop offset="1" stop-color="#30241a"/></linearGradient><linearGradient id="brassg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d0c49a"/><stop offset="1" stop-color="#66583b"/></linearGradient><radialGradient id="glowg"><stop stop-color="'+color+'" stop-opacity=".19"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></radialGradient></defs><ellipse cx="45" cy="38" rx="39" ry="29" fill="url(#glowg)"/><ellipse cx="45" cy="38" rx="34" ry="23" fill="none" stroke="'+color+'" stroke-opacity=".12" stroke-width="1"/><path d="M5 14h12m-12 0v7M85 14H73m12 0v7M5 63h12m-12 0v-7M85 63H73m12 0v-7" fill="none" stroke="'+color+'" stroke-opacity=".38" stroke-width=".7"/><g fill="url(#metalg)" stroke="#171b14" stroke-width="2.1" stroke-linejoin="round">'+shape+'</g><g fill="none" stroke="#d9d1b7" stroke-opacity=".55" stroke-width=".65">'+details+'</g>'+(isGun?'<g fill="url(#brassg)" stroke="#392d1c" stroke-width=".45"><circle cx="25" cy="35" r="1.1"/><circle cx="47" cy="35" r="1.1"/></g><g fill="none" stroke="#d6c9a8" stroke-opacity=".48" stroke-width=".6"><path d="M12 29l3-1m-1 13l3-1M39 28l2-1m14 12l3-1M62 30l3-1"/><path d="M15 49l3-1m8 9l2 1m21-3l2-1"/></g><path d="M8 68h74" stroke="#ad8c5a" stroke-width="1" opacity=".7"/><text x="9" y="11" fill="#c8b58b" font-size="4.5" letter-spacing="1">FIELD WORN</text>':'<path d="M8 68h74" stroke="'+color+'" stroke-width="1.5" opacity=".75"/>')+'<circle cx="72" cy="15" r="4.5" fill="'+color+'" opacity=".18"/><circle cx="72" cy="15" r="2.3" fill="'+color+'" opacity=".9"/></svg></div>'
}
function shopOpen(dead=false){fromShop=state==='menu'?'menu':'play';state='shop';tab='loadout';renderShop(dead)}
function renderShop(dead=false){
let tabs=[['loadout','LOADOUT'],['primary','PRIMARY'],['secondary','SECONDARY'],['armor','GEAR'],['perks','PERKS']],html='';
if(tab==='loadout'){
 const pg=primaryGunId?guns.find(g=>g.id===primaryGunId):null,sg=secondaryGunId?guns.find(g=>g.id===secondaryGunId):null,a=armor();
 const primaryCard=pg
  ? '<div class="item loadout-weapon-card"><div class="eyebrow">PRIMARY · KEY 1</div>'+itemArt(pg.id,pg.color)+'<h3>'+pg.name+'</h3><div class="statsline">DMG '+Math.round(pg.d*(1+(ranks.trigger||0)*.1))+(pg.id==='shotgun'?'×'+pg.pellets:'')+' · MAG '+pg.mag+'</div><div class="price">'+(activeSlot==='primary'?'ACTIVE':'EQUIPPED')+'</div><button data-tab="primary">CHANGE PRIMARY</button></div>'
  : '<div class="item"><div class="eyebrow">PRIMARY · KEY 1</div><div class="itemart empty-slot"><span>EMPTY SLOT</span></div><h3>No primary equipped</h3><p>Buy a primary weapon to fill this slot.</p><button data-tab="primary">CHOOSE PRIMARY</button></div>';
 const secondaryCard=sg
  ? '<div class="item loadout-weapon-card"><div class="eyebrow">SECONDARY · KEY 2</div>'+itemArt(sg.id,sg.color)+'<h3>'+sg.name+'</h3><div class="statsline">DMG '+Math.round(sg.d*(1+(ranks.trigger||0)*.1))+' · MAG '+sg.mag+'</div><div class="price">'+(activeSlot==='secondary'?'ACTIVE':'EQUIPPED')+'</div><button data-tab="secondary">CHANGE SECONDARY</button></div>'
  : '<div class="item"><div class="eyebrow">SECONDARY · KEY 2</div><div class="itemart empty-slot"><span>EMPTY SLOT</span></div><h3>No secondary equipped</h3><button data-tab="secondary">CHOOSE SECONDARY</button></div>';
 html='<div class="equippedbox"><div class="eyebrow">TWO-WEAPON LOADOUT · PRESS 1 OR 2 DURING COMBAT</div><div class="grid">'+primaryCard+secondaryCard+'</div><div class="eyebrow" style="margin-top:16px">EQUIPPED GEAR</div><div class="itemtop" style="margin-top:8px">'+itemArt(a?a.id:'vest',a?'#a8e56b':'#64746a')+'<div><h3>'+(a?a.name:'No armor equipped')+'</h3><p>'+(a?a.desc:'Choose protective gear in the GEAR tab.')+'</p></div></div></div>';
}
if(tab==='primary'){
 const list=guns.filter(g=>weaponSlot(g)==='primary');
 html='<div class="eyebrow" style="grid-column:1/-1">PRIMARY WEAPONS · PRESS 1 TO USE YOUR EQUIPPED PRIMARY</div>'+list.map(g=>{let own=owned.has(g.id),eq=primaryGunId===g.id;return '<div class="item weapon-item">'+itemArt(g.id,g.color)+'<h3>'+g.name+(eq?' ✓':'')+'</h3>'+weaponStats(g)+'<div class="price">'+(own?'Owned':'$'+g.cost+' · Requires Lv '+g.lv)+'</div>'+(!own?'<button data-buy="'+g.id+'" '+(cash<g.cost||level<g.lv?'disabled':'')+'>BUY PRIMARY</button>':'<button data-equip="'+g.id+'" '+(eq?'disabled':'')+'>'+(eq?'EQUIPPED IN PRIMARY':'EQUIP PRIMARY')+'</button>')+'</div>'}).join('');
}
if(tab==='secondary'){
 const list=guns.filter(g=>weaponSlot(g)==='secondary');
 html='<div class="eyebrow" style="grid-column:1/-1">SECONDARY WEAPONS · PRESS 2 TO USE YOUR EQUIPPED SECONDARY</div>'+list.map(g=>{let own=owned.has(g.id),eq=secondaryGunId===g.id;return '<div class="item weapon-item">'+itemArt(g.id,g.color)+'<h3>'+g.name+(eq?' ✓':'')+'</h3>'+weaponStats(g)+'<div class="price">'+(own?'Owned':'$'+g.cost)+'</div>'+(!own?'<button data-buy="'+g.id+'" '+(cash<g.cost||level<g.lv?'disabled':'')+'>BUY SECONDARY</button>':'<button data-equip="'+g.id+'" '+(eq?'disabled':'')+'>'+(eq?'EQUIPPED IN SECONDARY':'EQUIP SECONDARY')+'</button>')+'</div>'}).join('');
}
if(tab==='armor')html=armors.map(a=>'<div class="item">'+itemArt(a.id,a.id==='medic'?'#a8e56b':'#8aa5a0')+'<h3>'+a.name+(armorId===a.id?' ✓':'')+'</h3><p>'+a.desc+'</p><div class="price">'+(armorId===a.id?'Equipped':'$'+a.cost)+'</div><button data-armor="'+a.id+'" '+(armorId===a.id||cash<a.cost?'disabled':'')+'>'+(armorId===a.id?'EQUIPPED':'BUY & EQUIP')+'</button></div>').join('');
if(tab==='perks')html=perks.map(p=>{let r=ranks[p.id]||0,price=Math.round(p.cost*(1+r*.8));return '<div class="item">'+itemArt(p.id==='medic'?'medicperk':p.id,'#a8e56b')+'<h3>'+p.name+' <span style="color:#a8e56b">RANK '+r+'/'+p.max+'</span></h3><p>'+p.desc+'</p><div class="price">'+(r>=p.max?'MAX RANK':'$'+price)+'</div><button data-perk="'+p.id+'" '+(r>=p.max||cash<price?'disabled':'')+'>'+(r>=p.max?'MAXED':'UPGRADE')+'</button></div>'}).join('');
modal('<div class="eyebrow">FIELD QUARTERMASTER</div><h1>LOADOUT / ARMORY</h1><p>Equip one primary and one secondary at the same time. Switch with <b style="color:#a8e56b">1</b> and <b style="color:#a8e56b">2</b>. Purchases persist between runs. <b style="color:#ffd078">$'+cash+'</b> available · Level '+level+'</p><div class="tabs">'+tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'active':'')+'">'+t[1]+'</button>').join('')+'</div>'+(tab==='loadout'?html:'<div class="grid">'+html+'</div>')+'<div class="actions"><button class="primary" id="back">'+(dead?'BACK TO RESULTS':'RETURN TO FIELD')+'</button><button id="saveclose">SAVE & CLOSE</button></div>');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderShop(dead)});
document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let g=guns.find(x=>x.id===b.dataset.buy);if(g&&cash>=g.cost&&level>=g.lv&&!owned.has(g.id)){cash-=g.cost;owned.add(g.id);ammoByGun[g.id]=g.mag;reserveByGun[g.id]=g.id==='shotgun'?6:g.mag*2;equipWeapon(weaponSlot(g),g.id,true);save();renderShop(dead);toast(g.name+' acquired and equipped')}});
document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{const g=guns.find(x=>x.id===b.dataset.equip);if(g&&equipWeapon(weaponSlot(g),g.id,true)){save();renderShop(dead)}});

document.querySelectorAll('[data-armor]').forEach(b=>b.onclick=()=>{let a=armors.find(x=>x.id===b.dataset.armor);if(a&&cash>=a.cost){cash-=a.cost;armorId=a.id;if(player){player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+30)}save();renderShop(dead)}});
document.querySelectorAll('[data-perk]').forEach(b=>b.onclick=()=>{let p=perks.find(x=>x.id===b.dataset.perk),r=ranks[p.id]||0,price=Math.round(p.cost*(1+r*.8));if(p&&cash>=price&&r<p.max){cash-=price;ranks[p.id]=r+1;if(player){player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+15)}save();renderShop(dead)}});
const close=()=>{hide();if(dead){state='dead';gameOver()}else state=fromShop};$('#back').onclick=close;$('#saveclose').onclick=close
}
function gameOver(){modal(`<div class="eyebrow">SURVIVOR STATUS: KIA</div><h1>YOU DIDN'T<br>MAKE IT.</h1><p>You reached wave <b>${wave}</b>, eliminated <b>${kills}</b> zombies and reached level <b>${level}</b>. Your cash and equipment are saved.</p><div class="actions"><button class="primary" id="retry">TRY AGAIN</button><button id="review">REVIEW ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#retry').onclick=()=>{player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;refillRunAmmo();zs=[];shots=[];particles=[];drops=[];state='play';startWave();save();hide()};$('#review').onclick=()=>shopOpen(true);$('#home').onclick=()=>menu()}
$('#shop').onclick=()=>shopOpen();$('#pause').onclick=()=>pause();function pause(){if(state==='play'){state='pause';modal(`<div class="eyebrow">FIELD STATUS</div><h1>PAUSED</h1><p>Catch your breath. The infected can wait.</p><div class="actions"><button class="primary" id="resume">RESUME</button><button id="pShop">ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#resume').onclick=()=>{state='play';hide()};$('#pShop').onclick=()=>shopOpen();$('#home').onclick=()=>menu()}else if(state==='pause'){state='play';hide()}}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys.add(k);if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(!e.repeat&&state==='play'&&k==='1')switchWeapon('primary');if(!e.repeat&&state==='play'&&k==='2')switchWeapon('secondary');if(k==='r'&&state==='play'){if(!useAmmoBox())reload();}if(k==='b'){if(state==='shop'){hide();state=fromShop}else shopOpen()}if(k==='escape')pause()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});c.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});c.addEventListener('contextmenu',e=>e.preventDefault());function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(frame)}if(load()){player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;initWorld()}menu();requestAnimationFrame(frame);
})();
</script></body></html>
