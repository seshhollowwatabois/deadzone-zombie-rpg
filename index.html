let player=null,zs=[],shots=[],laserBeams=[],particles=[],texts=[],obstacles=[],drops=[],keys=new Set(),mouse={x:W/2,y:H/2,down:false},cash=180,wave=0,level=1,xp=0,xpNext=100,kills=0,gunId='pistol',owned=new Set(['pistol']),upgrades={},armorId=null,ranks={},state='menu',tab='weapons',spawned=0,total=0,spawnT=0,breakT=0,fireT=0,reloadT=0,toastT=0,annT=0,shake=0,last=0,fromShop='play';
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),getGun=()=>guns.find(g=>g.id===gunId)||guns[0],armor=()=>armors.find(a=>a.id===armorId),maxHp=()=>100+(armor()?.hp||0)+(ranks.vitality||0)*20,red=()=>armor()?.red||0,damage=()=>getGun().d*(1+(ranks.trigger||0)*.1)*(1+(upgrades[gunId]||0)*.12),speed=()=>player.speed*(1+(ranks.runner||0)*.07),bonus=()=>1+(ranks.scavenger||0)*.12;
function save(){try{localStorage.setItem('deadzone-rpg',JSON.stringify({cash,wave,level,xp,xpNext,kills,gunId,owned:[...owned],upgrades,armorId,ranks}))}catch(e){}}function load(){try{let s=JSON.parse(localStorage.getItem('deadzone-rpg')||'null');if(!s)return false;cash=s.cash??180;wave=s.wave||0;level=s.level||1;xp=s.xp||0;xpNext=s.xpNext||100;kills=s.kills||0;gunId=s.gunId||'pistol';owned=new Set(s.owned||['pistol']);upgrades=s.upgrades||{};armorId=s.armorId||null;ranks=s.ranks||{};return true}catch(e){return false}}
function newPlayer(){return{x:world.w/2,y:world.h/2,r:16,hp:100,maxHp:100,speed:220,angle:0,walk:0,flash:0,inv:0,ammo:getGun().mag}}function initWorld(){obstacles=[];for(let i=0;i<45;i++){let x=rand(80,world.w-80),y=rand(80,world.h-80);if(Math.hypot(x-world.w/2,y-world.h/2)<180)continue;let t=Math.random();obstacles.push({x,y,w:t<.25?rand(80,140):rand(40,75),h:t<.25?rand(32,50):rand(42,85),type:t<.25?'car':t<.6?'rubble':'barrier',rot:rand(-.12,.12)})}}

function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=rand(0,Math.PI*2),s=rand(30,230),life=rand(.15,.65);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,max:life,size:rand(1,4),color})}}
function spawnZombie(){let edge=Math.floor(rand(0,4)),x=edge===0?20:edge===1?world.w-20:rand(20,world.w-20),y=edge===2?20:edge===3?world.h-20:rand(20,world.h-20);let roll=Math.random(),type=wave>2&&roll<.18?'runner':wave>3&&roll<.29?'brute':wave>4&&roll<.4?'spitter':'walker',stats={walker:[44,58,10,'#687b5c',13],runner:[28,93,7,'#a2a75b',10],brute:[150,34,19,'#665148',22],spitter:[38,43,8,'#6e8b70',12]}[type];zs.push({x,y,r:stats[4],hp:stats[0]+wave*5,max:stats[0]+wave*5,speed:stats[1]+wave*1.3,dmg:stats[2]+wave*.4,color:stats[3],type,walk:rand(0,10),flash:0,attack:rand(.2,1),shoot:rand(1,2),dead:false})}
function zombieHead(z){const a=Math.atan2(player.y-z.y,player.x-z.x)-Math.PI/2;return{x:z.x+Math.sin(a)*z.r*.72,y:z.y-Math.cos(a)*z.r*.72}}function hitZombie(z,d,headshot=false){const dealt=headshot?d*2:d;z.hp-=dealt;z.flash=.12;texts.push({x:z.x,y:z.y-18,t:headshot?'HEADSHOT '+Math.round(dealt):Math.round(dealt),life:headshot?.9:.65,max:headshot?.9:.65,color:headshot?'#ffd078':'#ffe8a3'});burst(z.x,z.y,headshot?'#ffd078':'#a83c35',headshot?8:3);if(headshot)shake=Math.max(shake,2.5);if(z.hp<=0&&!z.dead){z.dead=true;kills++;let reward=Math.round(rand(9,18)*bonus());cash+=reward;xpGain(z.type==='brute'?30:15);if(Math.random()<.12)drops.push({x:z.x,y:z.y,life:14});burst(z.x,z.y,'#6e302b',15);if(z.type==='spitter')burst(z.x,z.y,'#79c56c',9);save()}}
function reload(){if(!player||reloadT>0||player.ammo===getGun().mag)return;reloadT=getGun().reload;toast('RELOADING…')}
function aimAngle(){if(!player)return 0;const q=cam(),targetX=mouse.x+q.x-W/2,targetY=mouse.y+q.y-H/2;return Math.atan2(targetY-player.y,targetX-player.x)}function laserRay(angle,g){
const ox=player.x+Math.cos(angle)*21,oy=player.y+Math.sin(angle)*21,range=g.id==='dmr'?1500:g.id==='rifle'?1250:g.id==='smg'?900:g.id==='shotgun'?560:820,dx=Math.cos(angle),dy=Math.sin(angle);

const styles={pistol:{width:2.2,glow:5},smg:{width:1.4,glow:3.5},shotgun:{width:3.2,glow:7},rifle:{width:2.5,glow:5.5},dmr:{width:4.5,glow:11}};

}
function shoot(){let g=getGun();if(reloadT>0||fireT>0)return;if(player.ammo<=0){reload();return}fireT=g.rate;player.ammo--;let a=aimAngle();player.angle=a;for(let i=0;i<g.pellets;i++){let ang=a+rand(-(g.spread||.018),g.spread||.018);laserRay(ang,g)}player.flash=.06;burst(player.x+Math.cos(a)*24,player.y+Math.sin(a)*24,g.color,4)}

function update(dt){if(annT>0){annT-=dt;if(annT<=0)$('#announce').classList.remove('show')}if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').classList.remove('show')}if(!player)return;if(state==='play'){if(fireT>0)fireT-=dt;if(reloadT>0){reloadT-=dt;if(reloadT<=0){player.ammo=getGun().mag;toast('RELOADED')}}if(player.inv>0)player.inv-=dt;if(player.flash>0)player.flash-=dt;let dx=(keys.has('d')?1:0)-(keys.has('a')?1:0),dy=(keys.has('s')?1:0)-(keys.has('w')?1:0),len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;let nx=player.x+dx*speed()*dt,ny=player.y+dy*speed()*dt;if(!blocked(nx,player.y,player.r))player.x=nx;if(!blocked(player.x,ny,player.r))player.y=ny;if(dx||dy)player.walk+=dt*10;player.angle=aimAngle();if(mouse.down)shoot();if(armor()?.regen)player.hp=Math.min(player.maxHp,player.hp+armor().regen*dt);

function modal(html){$('#modal').innerHTML=html;$('#overlay').style.display='flex'}function hide(){$('#overlay').style.display='none'}
function menu(){state='menu';modal(`<div class="eyebrow">EMERGENCY BROADCAST // DAY 19</div><h1>THE CITY<br>IS LOST.</h1><p>One survivor. Endless infected. Scavenge cash, build your loadout and hold the line against the outbreak.</p><div class="grid"><div class="item"><h3>COMBAT</h3><p>WASD move · Mouse aim · Left-click fire · R reload.</p></div><div class="item"><h3>SURVIVAL RPG</h3><p>Clear waves for rewards. Buy weapons, armor and perks. Progress saves in this browser.</p></div></div><div class="actions"><button class="primary" id="deploy">DEPLOY</button><button id="menuShop">ARMORY</button><button id="reset">RESET PROGRESS</button></div><p style="font-size:11px">Prototype 0.1 · Single player · Browser save</p>`);$('#deploy').onclick=()=>{if(!player)startFresh();else{state='play';if(wave===0)startWave()}state='play';hide();announce('DEPLOYED','STAY ALIVE')};$('#menuShop').onclick=()=>shopOpen();$('#reset').onclick=()=>{if(confirm('Delete saved progress?')){localStorage.removeItem('deadzone-rpg');player=null;cash=180;wave=0;level=1;xp=0;xpNext=100;kills=0;gunId='pistol';owned=new Set(['pistol']);upgrades={};armorId=null;ranks={};menu()}}}
function itemArt(type,color='#a8e56b'){let shape='';if(type==='pistol')shape='<path d="M16 31h43v11H16z M53 41h13v8H53z M22 42h20l4 21H28z"/><path d="M22 34h26v3H22z" fill="#aab6aa"/>';else if(type==='smg')shape='<path d="M8 31h16v9H8z M23 27h43v17H23z M63 32h18v7H63z M31 43h14l5 19H35z"/><path d="M28 30h26v3H28z" fill="#aab6aa"/>';else if(type==='shotgun')shape='<path d="M10 30h58v8H10z M65 32h18v5H65z M24 39h36v5H24z M26 44h18l4 17H30z"/><path d="M28 31h23v6H28z" fill="#a8794e"/>';else if(type==='rifle')shape='<path d="M6 31h18v9H6z M22 27h45v17H22z M64 32h19v6H64z M31 43h13l5 18H34z"/><path d="M28 30h27v3H28z M49 24h10v4H49z" fill="#aab6aa"/>';else if(type==='dmr')shape='<path d="M4 31h22v9H4z M23 28h43v15H23z M63 32h24v6H63z M30 43h13l5 17H34z"/><rect x="32" y="19" width="23" height="8" rx="3"/><rect x="36" y="21" width="15" height="3" fill="#aab6aa"/>';else if(type==='vest')shape='<path d="M29 17l-12 8-5 22 14 7 7-12 7 12 14-7-5-22-12-8-4 8z"/><path d="M29 28h12v20H29z M17 34h10v7H17z M43 34h10v7H43z" fill="#64766a"/>';else if(type==='kevlar')shape='<path d="M29 14l-15 10-3 25 15 7 8-13 8 13 15-7-3-25-15-10-5 8z"/><path d="M25 27h22v23H25z M29 31h14v3H29z M29 38h14v3H29z" fill="#8a9c89"/>';else if(type==='medic'||type==='medicperk')shape='<rect x="15" y="21" width="52" height="38" rx="7"/><path d="M36 27h10v9h9v9h-9v9H36v-9h-9v-9h9z" fill="#f4f5e9"/>';else if(type==='vitality')shape='<path d="M42 62S13 44 13 29c0-16 20-19 29-5 9-14 29-11 29 5 0 15-29 33-29 33z"/>';else if(type==='trigger')shape='<path d="M18 20h42v8H18z M24 28h30v13H24z M29 41h9v18h-9z"/><circle cx="60" cy="47" r="9"/>';else if(type==='runner')shape='<circle cx="42" cy="22" r="7"/><path d="M37 31l-12 14 12 7 8-10 9 17 7-4-11-24z M28 45L14 56l5 5 17-9z"/>';else if(type==='scavenger')shape='<path d="M18 23h48v36H18z M27 15h30v8H27z"/><path d="M34 30h16v5H34z M39 25h6v17h-6z" fill="#f6d47d"/>';else shape='<path d="M42 14l7 19 20 2-15 13 5 20-17-11-17 11 5-20-15-13 20-2z"/>';return '<div class="itemart"><svg viewBox="0 0 90 78" role="img" aria-label="'+type+' illustration"><defs><linearGradient id="metalg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9aa89b"/><stop offset="1" stop-color="#35433b"/></linearGradient></defs><g fill="url(#metalg)" stroke="#111914" stroke-width="2.5" stroke-linejoin="round">'+shape+'</g><circle cx="72" cy="15" r="4" fill="'+color+'"/><path d="M8 68h74" stroke="'+color+'" stroke-width="2" opacity=".6"/></svg></div>'}\nfunction shopOpen(dead=false){fromShop=state==='menu'?'menu':'play';state='shop';tab='loadout';renderShop(dead)}function renderShop(dead=false){let tabs=[['loadout','LOADOUT'],['weapons','WEAPONS'],['armor','GEAR'],['perks','PERKS']],html='';if(tab==='loadout'){let g=getGun(),a=armor();html='<div class="equippedbox"><div class="eyebrow">CURRENT PRIMARY</div><div class="itemtop">'+itemArt(g.id,g.color)+'<div><h3>'+g.name+'</h3><p>'+g.desc+'</p><div class="statsline">DMG '+Math.round(damage())+' · MAG '+g.mag+' · '+(1/g.rate).toFixed(1)+' shots/s</div></div></div><div class="eyebrow" style="margin-top:14px">EQUIPPED GEAR</div><div class="itemtop" style="margin-top:8px">'+itemArt(a?a.id:'vest',a?'#a8e56b':'#64746a')+'<div><h3>'+(a?a.name:'No armor equipped')+'</h3><p>'+(a?a.desc:'Choose protective gear in the GEAR tab.')+'</p></div></div></div><h2 style="font-size:17px;margin:18px 0 0">OWNED WEAPONS</h2><div class="grid">'+guns.filter(x=>owned.has(x.id)).map(x=>'<div class="item">'+itemArt(x.id,x.color)+'<h3>'+x.name+'</h3><div class="statsline">DMG '+Math.round(x.d*(1+(ranks.trigger||0)*.1)*(1+(upgrades[x.id]||0)*.12))+' · MAG '+x.mag+'</div><div class="price">'+(gunId===x.id?'EQUIPPED':'OWNED')+'</div><button data-equip="'+x.id+'" '+(gunId===x.id?'disabled':'')+'>'+(gunId===x.id?'EQUIPPED':'EQUIP WEAPON')+'</button></div>').join('')+'</div>'}if(tab==='weapons')html=guns.map(g=>{let own=owned.has(g.id),eq=gunId===g.id,u=upgrades[g.id]||0,p=Math.round(140+u*150);return `<div class="item">${itemArt(g.id,g.color)}<h3>${g.name} ${eq?'✓':''}</h3><p>${g.desc}<br><span style="color:#b8c9c2">DMG ${g.d} · ${(1/g.rate).toFixed(1)} shots/s · MAG ${g.mag} · UPGRADE ${u}/5</span></p><div class="price">${own?'Owned':'$'+g.cost+' · Requires Lv '+g.lv}</div>${!own?`<button data-buy="${g.id}" ${cash<g.cost||level<g.lv?'disabled':''}>BUY WEAPON</button>`:`<button data-equip="${g.id}" ${eq?'disabled':''}>${eq?'EQUIPPED':'EQUIP'}</button><button data-up="${g.id}" ${cash<p||u>=5?'disabled':''}>UPGRADE DAMAGE · $${p}</button>`}</div>`}).join('');if(tab==='armor')html=armors.map(a=>`<div class="item">${itemArt(a.id,a.id==='medic'?'#a8e56b':'#8aa5a0')}<h3>${a.name} ${armorId===a.id?'✓':''}</h3><p>${a.desc}</p><div class="price">${armorId===a.id?'Equipped':'$'+a.cost}</div><button data-armor="${a.id}" ${armorId===a.id||cash<a.cost?'disabled':''}>${armorId===a.id?'EQUIPPED':'BUY & EQUIP'}</button></div>`).join('');if(tab==='perks')html=perks.map(p=>{let r=ranks[p.id]||0,price=Math.round(p.cost*(1+r*.8));return `<div class="item">${itemArt(p.id==='medic'?'medicperk':p.id,'#a8e56b')}<h3>${p.name} <span style="color:#a8e56b">RANK ${r}/${p.max}</span></h3><p>${p.desc}</p><div class="price">${r>=p.max?'MAX RANK':'$'+price}</div><button data-perk="${p.id}" ${r>=p.max||cash<price?'disabled':''}>${r>=p.max?'MAXED':'UPGRADE'}</button></div>`}).join('');modal(`<div class="eyebrow">FIELD QUARTERMASTER</div><h1>ARMORY</h1><p>Spend cash on gear. Purchases persist between runs. <b style="color:#ffd078">$${cash}</b> available · Level ${level}</p><div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'active':''}">${t[1]}</button>`).join('')}</div><div class="grid">${html}</div><div class="actions"><button class="primary" id="back">${dead?'BACK TO RESULTS':'RETURN TO FIELD'}</button><button id="saveclose">SAVE & CLOSE</button></div>`);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderShop(dead)});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let g=guns.find(x=>x.id===b.dataset.buy);if(g&&cash>=g.cost&&level>=g.lv){cash-=g.cost;owned.add(g.id);gunId=g.id;if(player)player.ammo=g.mag;save();renderShop(dead);toast(g.name+' acquired')}});document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{gunId=b.dataset.equip;if(player)player.ammo=getGun().mag;reloadT=0;save();renderShop(dead)});document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let id=b.dataset.up,u=upgrades[id]||0,p=Math.round(140+u*150);if(cash>=p&&u<5){cash-=p;upgrades[id]=u+1;save();renderShop(dead)}});document.querySelectorAll('[data-armor]').forEach(b=>b.onclick=()=>{let a=armors.find(x=>x.id===b.dataset.armor);if(a&&cash>=a.cost){cash-=a.cost;armorId=a.id;if(player){player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+30)}save();renderShop(dead)}});document.querySelectorAll('[data-perk]').forEach(b=>b.onclick=()=>{let p=perks.find(x=>x.id===b.dataset.perk),r=ranks[p.id]||0,price=Math.round(p.cost*(1+r*.8));if(p&&cash>=price&&r<p.max){cash-=price;ranks[p.id]=r+1;if(player){player.maxHp=maxHp();player.hp=Math.min(player.maxHp,player.hp+15)}save();renderShop(dead)}});const close=()=>{hide();if(dead){state='dead';gameOver()}else state=fromShop};$('#back').onclick=close;$('#saveclose').onclick=close}
function gameOver(){modal(`<div class="eyebrow">SURVIVOR STATUS: KIA</div><h1>YOU DIDN'T<br>MAKE IT.</h1><p>You reached wave <b>${wave}</b>, eliminated <b>${kills}</b> zombies and reached level <b>${level}</b>. Your cash and equipment are saved.</p><div class="actions"><button class="primary" id="retry">TRY AGAIN</button><button id="review">REVIEW ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#retry').onclick=()=>{player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;zs=[];shots=[];particles=[];drops=[];state='play';startWave();hide()};$('#review').onclick=()=>shopOpen(true);$('#home').onclick=()=>menu()}
$('#shop').onclick=()=>shopOpen();$('#pause').onclick=()=>pause();function pause(){if(state==='play'){state='pause';modal(`<div class="eyebrow">FIELD STATUS</div><h1>PAUSED</h1><p>Catch your breath. The infected can wait.</p><div class="actions"><button class="primary" id="resume">RESUME</button><button id="pShop">ARMORY</button><button id="home">MAIN MENU</button></div>`);$('#resume').onclick=()=>{state='play';hide()};$('#pShop').onclick=()=>shopOpen();$('#home').onclick=()=>menu()}else if(state==='pause'){state='play';hide()}}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys.add(k);if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='r'&&state==='play')reload();if(k==='b'){if(state==='shop'){hide();state=fromShop}else shopOpen()}if(k==='escape')pause()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});c.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',e=>{if(e.button===0)mouse.down=false});c.addEventListener('contextmenu',e=>e.preventDefault());function frame(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(frame)}if(load()){player=newPlayer();player.maxHp=maxHp();player.hp=player.maxHp;initWorld()}menu();requestAnimationFrame(frame);
})();
</script></body></html>
